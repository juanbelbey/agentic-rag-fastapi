# docker-compose.yml
# Levanta el backend FastAPI y el frontend Streamlit juntos, comunicados por
# la red interna que Compose crea automaticamente para los servicios de este
# archivo (cada uno queda accesible por su nombre de servicio como hostname,
# ver streamlit_app/app.py: BACKEND_URL).

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: streamlit_app/Dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
