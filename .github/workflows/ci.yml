# CI pipeline para agentic-rag-fastapi
#
# Dos jobs separados con propósitos distintos:
#
#   rules   → corre en TODO push a cualquier rama
#             sin API key, sin costo, en ~10 segundos
#             verifica que el código no esté roto
#
#   evals   → corre SOLO en push a main
#             requiere OPENAI_API_KEY como secret de GitHub
#             verifica calidad de respuestas con LLM-as-judge
#             se ejecuta poco para mantener el costo bajo

name: CI

on:
  push:
    branches: ["**"]   # cualquier rama dispara el pipeline completo

jobs:

  # ─── Job 1: tests deterministas ────────────────────────────────────────────
  # Corre siempre. Sin LLM, sin costo, verifica que el código funciona.

  rules:
    name: Rules-based tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tests de reglas deterministas
        run: python -m pytest tests/test_rules.py -v --html=reports/report.html --self-contained-html

      - name: Guardar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

  # ─── Job 2: evaluaciones con LLM-as-judge ──────────────────────────────────
  # Corre SOLO en push a main. Requiere API key. Tiene costo por token.

  evals:
    name: LLM-as-judge evals
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'   # condición: solo en rama main

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MAX_EVAL_CASES: "1"
      # GitHub lee estos secrets desde:
      # Settings → Secrets and variables → Actions → OPENAI_API_KEY / DATABASE_URL
      # Nunca aparecen en logs ni en el código — GitHub los enmascara automáticamente
      # DATABASE_URL usa el rol ci_readonly (solo SELECT sobre chunks, ver Supabase) —
      # no la credencial completa de producción.
      # MAX_EVAL_CASES limita el golden set en CI para evitar gastar tokens de más.

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr evaluaciones LLM-as-judge
        run: python -m pytest tests/test_evals.py::TestRelevanceEval::test_rag_response_is_relevant -v --html=reports/evals-report.html --self-contained-html

      - name: Correr evaluación sistemática del golden set
        run: python evals/run_evals.py

      - name: Guardar artefactos de evaluacion
        if: always()   # guarda el reporte incluso si los tests fallan
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts-${{ github.run_number }}
          path: |
            reports/
            evals/results/
          retention-days: 30
          # Los artefactos se guardan 30 días en GitHub
          # Se descargan desde la pestaña "Actions" del repo
