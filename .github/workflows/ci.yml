# CI pipeline para agentic-rag-fastapi
#
# Tres niveles con proposito y costo distintos:
#
#   rules       → Nivel 1: TODO push/PR a cualquier rama
#                 0 llamadas a LLM/DB real, sin costo, en ~10 segundos
#                 verifica que el codigo no este roto (unit tests, routing,
#                 evaluadores code-based, retry mockeado, recursion, schemas)
#
#   smoke       → Nivel 2: SOLO push a main
#                 requiere OPENAI_API_KEY/DATABASE_URL como secret de GitHub
#                 3 casos fijos y curados contra el agente completo (RAG
#                 normal, tool routing, abstencion) -- costo minimo, gate de
#                 humo antes de mergear a main, no reemplaza al golden set
#
#   full_eval   → Nivel 3: SOLO manual (Actions -> Run workflow)
#                 golden set completo (56 casos), RAGAS (4 metricas) y
#                 retrieval (520 preguntas) -- la evaluacion sistematica
#                 completa, con costo real, nunca automatica en cada push

name: CI

on:
  push:
    branches: ["**"]   # cualquier rama dispara Nivel 1; solo main dispara tambien Nivel 2
  pull_request:
    branches: ["**"]   # Nivel 1 tambien en PRs
  workflow_dispatch:    # habilita "Run workflow" manual para Nivel 3 (full_eval)

jobs:

  # ─── Nivel 1: tests deterministas ──────────────────────────────────────────
  # Corre siempre. Sin LLM, sin costo, verifica que el código funciona.

  rules:
    name: "Nivel 1: Rules-based tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tests de reglas deterministas
        run: python -m pytest tests/ --ignore=tests/test_evals.py -v --html=reports/report.html --self-contained-html

      - name: Guardar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

  # ─── Nivel 2: smoke test con LLM-as-judge ──────────────────────────────────
  # Corre SOLO en push a main. Requiere API key. Tiene costo por token, minimo
  # a proposito: 3 casos fijos, no el golden set completo (eso es Nivel 3).

  smoke:
    name: "Nivel 2: Smoke test (agente completo)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # solo push a main, nunca en PRs ni manual

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # GitHub lee estos secrets desde:
      # Settings → Secrets and variables → Actions → OPENAI_API_KEY / DATABASE_URL
      # Nunca aparecen en logs ni en el código — GitHub los enmascara automáticamente
      # DATABASE_URL usa el rol ci_readonly (solo SELECT sobre chunks, ver Supabase) —
      # no la credencial completa de producción.

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: "Correr smoke test (RAG normal + tool routing + abstencion)"
        run: python -m pytest tests/test_evals.py -v --html=reports/smoke-report.html --self-contained-html

      - name: Guardar reporte de smoke test
        if: always()   # guarda el reporte incluso si los tests fallan
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
          # Los artefactos se guardan 30 días en GitHub
          # Se descargan desde la pestaña "Actions" del repo

  # ─── Nivel 3: evaluacion sistematica completa ──────────────────────────────
  # Corre SOLO manual (pestaña Actions → CI → Run workflow). Costo real: golden
  # set completo (56 casos con LLM-judge), RAGAS (4 metricas) y retrieval
  # (520 preguntas, solo embeddings, sin generacion). Nunca automatico.

  full_eval:
    name: "Nivel 3: Full evaluation (manual)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr golden set completo (56 casos, LLM-as-judge)
        run: python evals/run_evals.py

      - name: Correr RAGAS (faithfulness, answer_relevancy, context_precision, context_recall)
        run: python evals/ragas_eval.py

      - name: Correr metricas de retrieval (hit_rate/MRR sobre 520 preguntas)
        run: python -m evals.retrieval_metrics

      - name: Guardar artefactos de evaluacion completa
        if: always()   # guarda los resultados incluso si algun paso falla
        uses: actions/upload-artifact@v4
        with:
          name: full-eval-artifacts-${{ github.run_number }}
          path: evals/results/
          retention-days: 30
          # Los artefactos se guardan 30 días en GitHub
          # Se descargan desde la pestaña "Actions" del repo
